name: Publish Proto Artifact

on:
    release:
        types: [published]
    workflow_dispatch:
        inputs:
            version:
                description: "公開するバージョン（vX.Y.Z または vX.Y.Z-suffix）"
                required: false
                type: string

permissions:
    contents: read
    packages: write

jobs:
    publish:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Resolve version and tags
              id: version
              uses: pj-hoakari/actions/resolve-version@92b346752a66ad19a36fbc929191603f72e00fe9 # v20261020.0.2
              with:
                  version: ${{ inputs.version }}

            - name: Set up mise
              uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
              with:
                  install_args: go buf task

            - name: Export proto
              run: task proto:export

            - name: Push proto artifact
              uses: pj-hoakari/actions/publish-proto@92b346752a66ad19a36fbc929191603f72e00fe9 # v20261020.0.2
              with:
                  version: ${{ steps.version.outputs.version }}
                  tags: ${{ steps.version.outputs.tags }}
                  proto-dir: build/proto

            - name: Push proto bundle artifact
              uses: pj-hoakari/actions/publish-proto@92b346752a66ad19a36fbc929191603f72e00fe9 # v20261020.0.2
              with:
                  version: ${{ steps.version.outputs.version }}
                  tags: ${{ steps.version.outputs.tags }}
                  artifact: ghcr.io/${{ github.repository }}-proto-bundle
                  proto-dir: build/proto-bundle
