name: Sync with-db

on:
    push:
        branches: [main]

permissions: {}

concurrency:
    group: sync-with-db
    cancel-in-progress: false

jobs:
    sync:
        if: github.repository == 'pj-hoakari/go-service-template'
        runs-on: ubuntu-latest
        environment:
            name: sync
            deployment: false
        env:
            GH_REPO: ${{ github.repository }}
            BASE_BRANCH: with-db
            SYNC_BRANCH: sync/main-to-with-db
            ASSIGNEE: KasumiMercury
        steps:
            - name: Create GitHub App token
              id: app-token
              uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
              with:
                  client-id: ${{ vars.SYNC_APP_CLIENT_ID }}
                  private-key: ${{ secrets.SYNC_APP_PRIVATE_KEY }}
                  permission-contents: write
                  permission-pull-requests: write
                  permission-workflows: write

            - name: Inspect sync state
              id: state
              env:
                  GH_TOKEN: ${{ steps.app-token.outputs.token }}
              run: |
                  ahead=$(gh api "repos/$GH_REPO/compare/$BASE_BRANCH...main" --jq .ahead_by)
                  pr=$(gh pr list --base "$BASE_BRANCH" --head "$SYNC_BRANCH" --state open --json number --jq '.[0].number // empty')
                  echo "ahead=$ahead" >> "$GITHUB_OUTPUT"
                  echo "pr=$pr" >> "$GITHUB_OUTPUT"
                  if [ "$ahead" = "0" ]; then
                    echo "::notice::$BASE_BRANCH は main を取り込み済みのため同期をスキップしました"
                  fi

            - name: Update sync branch
              if: steps.state.outputs.ahead != '0'
              env:
                  GH_TOKEN: ${{ steps.app-token.outputs.token }}
                  PR: ${{ steps.state.outputs.pr }}
              run: |
                  main_sha=$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)

                  if ! gh api "repos/$GH_REPO/git/ref/heads/$SYNC_BRANCH" --silent 2>/dev/null; then
                    gh api -X POST "repos/$GH_REPO/git/refs" -f ref="refs/heads/$SYNC_BRANCH" -f sha="$main_sha" --silent
                    exit 0
                  fi

                  if [ -z "$PR" ]; then
                    gh api -X PATCH "repos/$GH_REPO/git/refs/heads/$SYNC_BRANCH" -f sha="$main_sha" -F force=true --silent
                    exit 0
                  fi

                  if gh api -X PATCH "repos/$GH_REPO/git/refs/heads/$SYNC_BRANCH" -f sha="$main_sha" -F force=false --silent 2>/dev/null; then
                    exit 0
                  fi

                  if ! out=$(gh api -X POST "repos/$GH_REPO/merges" -f base="$SYNC_BRANCH" -f head=main 2>&1); then
                    echo "$out"
                    if echo "$out" | grep -q "HTTP 409"; then
                      gh pr comment "$PR" --body "main の新しい変更（${main_sha}）が \`$SYNC_BRANCH\` と競合したため取り込めませんでした。ローカルで \`origin/main\` を \`$SYNC_BRANCH\` にマージして解消してください。"
                    fi
                    exit 1
                  fi

            - name: Open pull request
              id: open
              if: steps.state.outputs.ahead != '0' && steps.state.outputs.pr == ''
              env:
                  GH_TOKEN: ${{ steps.app-token.outputs.token }}
              run: |
                  body=$(cat <<EOF
                  main の変更を $BASE_BRANCH に取り込む同期 PR

                  必須チェックが通ると auto-merge によりマージコミットでマージされる
                  squash / rebase ではマージしないこと（main との祖先関係が失われ、以降の同期で毎回競合する）

                  ### 競合した場合

                  単純な競合は「Resolve conflicts」から Web 上で解消できる
                  Web 上で解消できない場合はローカルで解消する

                  \`\`\`bash
                  git fetch origin
                  git switch $SYNC_BRANCH
                  git merge origin/$BASE_BRANCH
                  # go.mod / go.sum の競合は「main の更新 + DB 依存の追加」の形に編集し go mod tidy で go.sum を再生成
                  go test ./...
                  git push origin $SYNC_BRANCH
                  \`\`\`

                  解消後に auto-merge が無効になっている場合は、有効化するか「Create a merge commit」で手動マージする
                  EOF
                  )

                  pr=$(gh api -X POST "repos/$GH_REPO/pulls" \
                    -f title="chore: sync main into $BASE_BRANCH" \
                    -f head="$SYNC_BRANCH" \
                    -f base="$BASE_BRANCH" \
                    -f body="$body" \
                    --jq .number)
                  gh api -X POST "repos/$GH_REPO/issues/$pr/assignees" -f "assignees[]=$ASSIGNEE" --silent
                  echo "pr=$pr" >> "$GITHUB_OUTPUT"

            - name: Enable auto-merge
              if: steps.state.outputs.ahead != '0'
              env:
                  GH_TOKEN: ${{ steps.app-token.outputs.token }}
                  PR: ${{ steps.open.outputs.pr || steps.state.outputs.pr }}
              run: |
                  if [ "$(gh pr view "$PR" --json autoMergeRequest --jq '.autoMergeRequest == null')" != "true" ]; then
                    exit 0
                  fi
                  if ! gh pr merge "$PR" --auto --merge; then
                    echo "::warning::auto-merge を有効化できませんでした。PR #$PR を確認してください"
                  fi
