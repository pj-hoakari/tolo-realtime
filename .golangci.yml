version: "2"

linters:
    default: standard
    enable:
        - wsl_v5
        - bodyclose
        - contextcheck
        - fatcontext
        - containedctx
        - exhaustruct_v5
        - exhaustive
        - forbidigo
        - gosec
        - nilnil
        - nilerr
        - nlreturn
    settings:
        errcheck:
            check-type-assertions: true
            check-blank: true
            disable-default-exclusions: true
            exclude-functions:
                - fmt.Print
                - fmt.Printf
                - fmt.Println
        forbidigo:
            forbid:
                # Internal errors must go through connect.InternalError so the
                # cause is logged server-side and never reaches the client.
                - pattern: '^connectrpc\.CodeInternal$'
                  msg: "build internal errors with InternalError(ctx, err) instead of connectrpc.CodeInternal"
                - pattern: '^connectrpc\.NewError$'
                  msg: "add a row to clientErrors in internal/infra/connect/errors.go and return connectError(ctx, err) instead of connectrpc.NewError"
                # Logging goes through log/slog, so that every record comes out
                # in the structure Cloud Logging parses and carries the trace of
                # its request context.
                - pattern: '^log\.[A-Z]\w*$'
                  msg: "use log/slog (internal/logging) instead of the standard log package"
        exhaustruct_v5:
            ignore-patterns:
                - 'crypto/tls\.Config'
                - 'log/slog\.HandlerOptions'
                - 'net/http\.Server'
                - 'net/http\.Client'
                - 'net/http\.Transport'
        wsl_v5:
            allow-first-in-block: true
            allow-whole-block: false
            branch-max-lines: 2
    exclusions:
        rules:
            - path: _test\.go
              linters:
                  - errcheck
                  - exhaustruct_v5
                  - forbidigo
                  - gosec
                  - staticcheck
                  - fatcontext
                  - containedctx
            - path: internal/infra/connect/errors\.go
              linters:
                  - forbidigo
              text: connectrpc\.NewError
