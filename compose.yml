services:
    postgres:
        image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        environment:
            POSTGRES_USER: ${POSTGRES_USER:?copy .env.example to .env}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env}
            POSTGRES_DB: ${POSTGRES_DB:?copy .env.example to .env}
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
            interval: 5s
            timeout: 5s
            retries: 10
        ports:
            - "5432:5432"
        volumes:
            - postgres-data:/var/lib/postgresql

    migrate:
        build:
            context: .
            target: migrate
        command:
            [
                "-database",
                "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable",
                "up",
            ]
        depends_on:
            postgres:
                condition: service_healthy

    firebase-emulator:
        build:
            context: ./firebase-emulator
        ports:
            - "8081:8080"
            - "9099:9099"
            - "4000:4000"
        healthcheck:
            test: ["CMD", "wget", "-qO-", "http://localhost:8080/"]
            interval: 2s
            timeout: 2s
            retries: 60

    server:
        build:
            context: .
        environment:
            DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
            SERVER_ADDR: :8080
            FIRESTORE_PROJECT_ID: demo-tolo
            FIRESTORE_EMULATOR_HOST: firebase-emulator:8080
            FIREBASE_AUTH_EMULATOR_HOST: firebase-emulator:9099
            INTERNAL_JWKS_URL: ${INTERNAL_JWKS_URL:-http://mockdeps:8080/.well-known/jwks.json}
        depends_on:
            migrate:
                condition: service_completed_successfully
            firebase-emulator:
                condition: service_healthy
            mockdeps:
                condition: service_started
        ports:
            - "8080:8080"

    mockdeps:
        build:
            context: .
            target: mockdeps
        ports:
            - "8089:8080"

    e2e:
        profiles: [e2e]
        build:
            context: .
            target: e2e
        environment:
            FIREBASE_AUTH_EMULATOR_HOST: firebase-emulator:9099
        depends_on:
            server:
                condition: service_started

volumes:
    postgres-data:
