services:
    postgres:
        image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        environment:
            POSTGRES_USER: ${POSTGRES_USER:?copy .env.example to .env}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env}
            POSTGRES_DB: ${POSTGRES_DB:?copy .env.example to .env}
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
            interval: 5s
            timeout: 5s
            retries: 10
        ports:
            - "5432:5432"
        volumes:
            - postgres-data:/var/lib/postgresql

    migrate:
        build:
            context: .
            target: migrate
        command:
            [
                "-database",
                "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable",
                "up",
            ]
        depends_on:
            postgres:
                condition: service_healthy

    server:
        build:
            context: .
        environment:
            DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
            SERVER_ADDR: :8080
        depends_on:
            migrate:
                condition: service_completed_successfully
        ports:
            - "8080:8080"

volumes:
    postgres-data:
