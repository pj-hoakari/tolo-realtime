# 監視 (observability) スタック用のオーバーライド
# ベースに重ねて使う:
#   docker compose -f compose.yml -f compose.o11y.yml up --build
services:
    jaeger:
        image: jaegertracing/jaeger:2.23.0@sha256:3823829974ccfc2485d2e48b165579091f32295022ae80ca49704e2f4834116e
        ports:
            - "16686:16686" # Jaeger UI
            - "4317:4317" # OTLP gRPC
            - "4318:4318" # OTLP HTTP

    server:
        environment:
            OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
            OTEL_SERVICE_NAME: tolo-realtime
        depends_on:
            jaeger:
                condition: service_started
