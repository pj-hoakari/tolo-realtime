# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

dotenv: [".env"]

vars:
    # compose.yml の postgres サービスを指す既定接続先
    # 環境変数 DATABASE_URL で migrate タスク上書き
    DEFAULT_DATABASE_URL: postgres://{{.POSTGRES_USER}}:{{.POSTGRES_PASSWORD}}@localhost:5432/{{.POSTGRES_DB}}?sslmode=disable

tasks:
    release:
        desc: Create a GitHub release after checking that VERSION is newer than every existing tag.
        requires:
            vars: [VERSION]
        silent: true
        cmds:
            - |
                set -euo pipefail

                TAG="{{.VERSION}}"
                SEMVER='^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'
                if ! printf '%s' "${TAG#v}" | grep -Eq "$SEMVER" || [ "${TAG:0:1}" != "v" ]; then
                  echo "usage: task release VERSION=vX.Y.Z（または vX.Y.Z-suffix）。指定値: '${TAG}'" >&2
                  exit 1
                fi

                if [ -n "$(git ls-remote --tags origin "refs/tags/${TAG}")" ]; then
                  echo "タグ ${TAG} は既にあります" >&2
                  exit 1
                fi

                VERSION="${TAG#v}"
                LATEST="$(git ls-remote --tags --refs origin 'refs/tags/v*' \
                  | sed 's|.*refs/tags/v||' | grep -E "$SEMVER" \
                  | sed 's/-/~/' | sort -V | tail -n 1 | sed 's/~/-/' || true)"
                if [ -n "$LATEST" ]; then
                  HIGHEST="$(printf '%s\n%s\n' "$LATEST" "$VERSION" | sed 's/-/~/' | sort -V | tail -n 1 | sed 's/~/-/')"
                  if [ "$HIGHEST" != "$VERSION" ]; then
                    echo "${TAG} は最新のバージョン v${LATEST} より新しくありません" >&2
                    exit 1
                  fi
                fi

                ARGS=(--title "$TAG" --generate-notes)
                case "$VERSION" in
                  *-*) ARGS+=(--prerelease) ;;
                esac

                echo "release ${TAG}（現在の最新: ${LATEST:+v}${LATEST:-なし}）"
                if [ "${DRY_RUN:-}" = "1" ]; then
                  exit 0
                fi
                gh release create "$TAG" "${ARGS[@]}"

    up:
        desc: Start the development environment.
        cmds:
            - docker compose up -d

    up:build:
        desc: Build and start the development environment.
        cmds:
            - docker compose up -d --build

    up:o11y:
        desc: Start the development environment with observability.
        cmds:
            - docker compose -f compose.yml -f compose.o11y.yml up -d

    up:build:o11y:
        desc: Build and start the development environment with observability.
        cmds:
            - docker compose -f compose.yml -f compose.o11y.yml up -d --build

    down:
        desc: Stop the development environment.
        cmds:
            - docker compose down

    down:o11y:
        desc: Stop the development environment with observability.
        cmds:
            - docker compose -f compose.yml -f compose.o11y.yml down

    proto:
        desc: Lint proto and regenerate connect-go code for development.
        cmds:
            - task: proto:lint
            - task: proto:gen:go

    proto:write-authz:
        desc: Write authz proto to proto directory.
        cmds:
          - go tool protoc-gen-authz-go --write-proto proto

    proto:lint:
        desc: Lint proto.
        deps:
          - proto:write-authz
        cmds:
            - buf lint

    proto:gen:go:
        desc: Regenerate connect-go code from proto.
        deps:
          - proto:write-authz
        cmds:
            - buf generate --template buf.gen.go.yaml
        sources:
            - "proto/**/*.proto"
            - buf.yaml
            - buf.gen.go.yaml
        generates:
            - "gen/**/*"

    proto:gen:es:
        desc: Regenerate connect-es code from proto.
        deps:
          - proto:write-authz
        cmds:
            - buf generate --template buf.gen.es.yaml
        sources:
            - "proto/**/*.proto"
            - buf.yaml
            - buf.gen.es.yaml
            - clients/connect-es/package.json
        generates:
            - "clients/connect-es/gen/**/*"

    migrate:create:
        desc: |
            Create a new empty migration pair (up/down) with a sequential version.
            Usage: task migrate:create -- <migration_name>
        cmds:
            - migrate create -ext sql -dir migrations -seq {{.CLI_ARGS}}

    migrate:up:
        desc: |
            Apply all pending migrations. Override the target DB with DATABASE_URL.
            Usage: [DATABASE_URL=...] task migrate:up -- [N]
        vars:
            DATABASE_URL:
                sh: 'echo "${DATABASE_URL:-{{.DEFAULT_DATABASE_URL}}}"'
        cmds:
            - migrate -path migrations -database "{{.DATABASE_URL}}" up {{.CLI_ARGS}}

    migrate:down:
        desc: |
            Roll back migrations (default 1 step). Override the target DB with DATABASE_URL.
            Usage: [DATABASE_URL=...] task migrate:down -- [N]
        vars:
            DATABASE_URL:
                sh: 'echo "${DATABASE_URL:-{{.DEFAULT_DATABASE_URL}}}"'
            STEPS: '{{.CLI_ARGS | default "1"}}'
        cmds:
            - migrate -path migrations -database "{{.DATABASE_URL}}" down {{.STEPS}}

    migrate:version:
        desc: |
            Show the current migration version and dirty state.
            Usage: [DATABASE_URL=...] task migrate:version
        vars:
            DATABASE_URL:
                sh: 'echo "${DATABASE_URL:-{{.DEFAULT_DATABASE_URL}}}"'
        cmds:
            - migrate -path migrations -database "{{.DATABASE_URL}}" version

    migrate:force:
        desc: |
            Force set the migration version (recover from a dirty state; does not run SQL).
            Usage: [DATABASE_URL=...] task migrate:force -- <version>
        vars:
            DATABASE_URL:
                sh: 'echo "${DATABASE_URL:-{{.DEFAULT_DATABASE_URL}}}"'
        cmds:
            - migrate -path migrations -database "{{.DATABASE_URL}}" force {{.CLI_ARGS}}
