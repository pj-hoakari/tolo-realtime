[tools]
actionlint = "1.7.12"
betterleaks = "latest"
buf = "1.75.0"
go = "1.27.3"
golangci-lint = "2.15.0"
lefthook = "latest"
oras = "latest"
task = "latest"

[hooks]
postinstall = "if [ -z \"${CI:-}\" ] && git rev-parse --git-dir > /dev/null 2>&1; then lefthook install; fi"

[settings]
experimental = true
